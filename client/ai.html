<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | CollabSphere</title>
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="ai.css">
<div class="ai-container">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .ai-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
        }
        .ai-panel {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 28px rgba(0,0,0,.06);
        }
        .ai-messages {
            min-height: 300px;
            max-height: 450px;
            overflow-y: auto;
            padding: 16px 0;
        }
        .ai-message {
            padding: 13px 16px;
            margin: 12px 0;
            border-radius: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
        .ai-user {
            background: #eee9ff;
            margin-left: 12%;
        }
        .ai-bot {
            background: #f3f5f9;
            margin-right: 12%;
        }
        .ai-form {
            display: flex;
            gap: 10px;
        }
        .ai-form textarea {
            flex: 1;
            min-width: 0;
            resize: vertical;
            padding: 14px;
            border: 1px solid #dfe2eb;
            border-radius: 12px;
            font: inherit;
        }
        .ai-form button {
            padding: 12px 20px;
            border: 0;
            border-radius: 12px;
            background: #691d27;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        #aiStatus {
            color: #73788b;
            margin-top: 12px;
        }
        @media (max-width: 600px) {
            .ai-container { padding: 12px; }
            .ai-form { flex-direction: column; }
            .ai-user, .ai-bot { margin-left: 0; margin-right: 0; }
        }
    </style>
</head>
<body>
    <main class="ai-container">
        <p><a href="dashboard.html">← Back to Dashboard</a></p>
        <h1>✨ CollabSphere AI Assistant</h1>
        <p>Ask questions about coding, debugging, and your development projects.</p>

        <section class="ai-panel">
            <div id="aiMessages" class="ai-messages" aria-live="polite">
                <div class="ai-message ai-bot">
                    Hi! I'm your CollabSphere AI Assistant. What can I help you with?
                </div>
            </div>

            <form id="aiForm" class="ai-form">
                <textarea id="aiQuestion" rows="2"
                    placeholder="Ask your coding question..." required></textarea>
                <button id="aiSend" type="submit">Send</button>
            </form>
            <p id="aiStatus" role="status"></p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ai.js"></script>
</body>
</html>
