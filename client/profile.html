<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CollabSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/app-theme.css">
    <style>
        .profile-wrap{max-width:850px;margin:40px auto;padding:24px}
        .profile-card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #00000012}
        .profile-avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#635bff;color:white;font-size:36px;font-weight:bold;margin-bottom:20px}
        .profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:25px}
        .profile-field{padding:18px;border-radius:12px;background:#f5f6fa;overflow-wrap:anywhere}
        .profile-field small{display:block;color:#666;margin-bottom:8px}
        .profile-field strong{color:#222}
        .profile-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
        .profile-actions a,.profile-actions button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font:inherit}
        .profile-message{margin-top:18px}
    </style>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <main class="profile-wrap">
        <p><a href="dashboard.html">← Back to Dashboard</a></p>
        <section class="profile-card">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <h1>My Profile</h1>
            <p>View your CollabSphere account information.</p>
            <p id="profileMessage" class="profile-message">Loading your profile...</p>

            <div class="profile-grid">
                <div class="profile-field">
                    <small>Full name</small>
                    <strong id="profileName">Loading...</strong>
                </div>
                <div class="profile-field">
                    <small>Email address</small>
                    <strong id="profileEmail">Loading...</strong>
                </div>
                <div class="profile-field">
                    <small>Username</small>
                    <strong id="profileUsername">—</strong>
                </div>
                <div class="profile-field">
                    <small>Account ID</small>
                    <strong id="profileId">—</strong>
                </div>
            </div>

            <div class="profile-actions">
                <a href="dashboard.html">Dashboard</a>
                <button type="button" id="refreshProfile">Refresh Profile</button>
                <button type="button" id="logoutButton">Log Out</button>
            </div>
        </section>
    </main>
    <script src="js/profile.js"></script>
</body>
</html>
