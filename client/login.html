
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CollabSphere</title>

    <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app-theme.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <a href="index.html" class="logo">
                <span class="logo-icon">C</span>
                <span>CollabSphere</span>
            </a>

            <!-- Heading -->
            <div class="auth-header">
                <h1>Welcome Back!</h1>
                <p>Sign in to continue collaborating with your team.</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Remember Me -->
                <div class="terms-row">
                    <label>
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Error / Success Message -->
                <p id="message" class="form-message" role="status" aria-live="polite"></p>

                <!-- Submit Button -->
                <button type="submit" id="loginButton" class="btn-primary">
                    Sign In
                </button>

            </form>

          
            <p class="login-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <!-- Back to Home -->
            <a href="index.html" class="back-link">
                &larr; Back to Home
            </a>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
