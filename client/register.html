
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CollabSphere</title>

    <meta name="description" content="Create your CollabSphere account to manage projects, collaborate with developers, and use AI-powered tools.">

    <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app-theme.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <a href="index.html" class="logo">
                <span class="logo-icon">C</span>
                CollabSphere
            </a>

            <div class="auth-heading">
                <h1>Create your account</h1>
                <p>Start building something amazing together.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="50"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="terms-row">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the terms of use and privacy policy.
                    </label>
                </div>

                <button type="submit" id="registerButton" class="btn-primary">
                    Create Account
                </button>

                <p id="message" class="form-message" role="status" aria-live="polite"></p>

            </form>

            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>

            <a href="login.html" class="login-link">
                Log in to CollabSphere
            </a>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
